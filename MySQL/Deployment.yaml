apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:
    metadata:
      labels:
        app: otel-collector

    spec:
      #serviceAccountName: otel-collector

      containers:
      - name: otel-collector

        image: docker.io/otel/opentelemetry-collector-contrib:0.162.0-amd64

        envFrom:
        - secretRef:
            name: otel-collector-secrets

        args:
        - "--config=/conf/collector.yaml"
        - "--config=/conf2/dbm-config.yaml"

        ports:
        - containerPort: 4317
          name: otlp-grpc

        - containerPort: 4318
          name: otlp-http

        - containerPort: 8888
          name: metrics

        volumeMounts:
        - name: config
          mountPath: /conf
        - name: config2
          mountPath: /conf2

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

      volumes:
      - name: config
        configMap:
          name: otel-collector-config
      - name: config2
        configMap:
          name: otel-collector-config2
