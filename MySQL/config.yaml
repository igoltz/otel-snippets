apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  collector.yaml: |
    receivers:
      mysql:
        endpoint: ${env:MYSQL_SERVICE}:3306
        username: ${env:MYSQL_USER}
        password: ${env:MYSQL_PASSWORD}
        database: ${env:MYSQL_DATABASE}
        collection_interval: 10s
        initial_delay: 1s
        tls:
          insecure: false
      sql_query/mysql_limits:
        driver: mysql
        datasource: "${env:MYSQL_USER}:${env:MYSQL_PASSWORD}@tcp(${env:MYSQL_SERVICE}:3306)/mysql?tls=true"
        collection_interval: 60s
        queries:
          - sql: "SELECT @@max_connections AS max_connections, '${env:MYSQL_SERVICE}:3306' AS mysql_instance_endpoint"
            metrics:
              - metric_name: mysql.connection.max
                value_column: max_connections
                attribute_columns: [mysql_instance_endpoint]
                value_type: int
                data_type: gauge

    processors:
      batch:
        send_batch_size: 10000
        timeout: 10s

    exporters:
      otlp_http/openobserve:
        endpoint: ${env:OTEL_SERVICE}
        headers:
          Authorization: ${env:OTEL_AUTH}
          stream-name: ${env:OTEL_STREAM}

    service:
      pipelines:
        metrics:
          receivers: [mysql, sql_query/mysql_limits]
          processors: [batch]
          exporters: [otlp_http/openobserve]
