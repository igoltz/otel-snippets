receivers:
  mysql:
    endpoint: "localhost:3306"
    username: otel
    password: ${env:MYSQL_PASSWORD}
    database: otel
    collection_interval: 10s
    initial_delay: 1s
  sqlquery/mysql_limits:
    driver: mysql
    datasource: "${env:MYSQL_USER}:${env:MYSQL_PASSWORD}@tcp(localhost:3306)/mysql"
    collection_interval: 60s
    queries:
      - sql: "SELECT @@max_connections AS max_connections, 'localhost:3306' AS mysql_instance_endpoint"
        metrics:
          - metric_name: mysql.connection.max
            value_column: max_connections
            attribute_columns: [mysql_instance_endpoint]
            value_type: int
            data_type: gauge

processors:
  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  otlphttp/openobserve:
    endpoint: https://eu1-api.openobserve.ai/api/XXXXXXXXXXXXXXXXXXX
    headers:
      Authorization: Basic XXXXXXXXXXXXXXXXXXXXXXX==
      stream-name: default

service:
  pipelines:
    metrics:
      receivers: [mysql, sqlquery/mysql_limits]
      processors: [batch]
      exporters: [otlphttp/openobserve]
